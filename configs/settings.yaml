benchmarks: [SPY, QQQ]

database: data/processed/portfolio.db

risk:
  max_position_weight: 0.25     # flag any single position above 25% of equity
  max_sector_weight: 0.40       # flag any sector above 40% of holdings
  large_loss_pct: 0.20          # flag positions down more than 20% from cost
  earnings_window_days: 7       # flag earnings within this many days
  long_term_window_days: 30     # flag lots that turn long-term within this many days
  idle_cash_pct: 0.10           # flag when cash is above 10% of equity
  option_expiry_window_days: 7  # flag option positions expiring within this many days
  high_short_interest: 0.15     # flag short interest above 15% of float
  correlation_threshold: 0.80   # report holding pairs whose daily returns correlate above this
