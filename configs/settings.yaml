benchmarks: [SPY, QQQ]

database: data/processed/portfolio.db

risk:
  max_position_weight: 0.25     # flag any single position above 25% of equity
  max_sector_weight: 0.40       # flag any sector above 40% of holdings
  large_loss_pct: 0.20          # flag positions down more than 20% from cost
  earnings_window_days: 7       # flag earnings within this many days
  long_term_window_days: 30     # flag lots that turn long-term within this many days
  idle_cash_pct: 0.10           # flag when cash is above 10% of equity
  option_expiry_window_days: 7  # flag option positions expiring within this many days
  high_short_interest: 0.15     # flag short interest above 15% of float
  correlation_threshold: 0.80   # report holding pairs whose daily returns correlate above this

news:
  lookback_days: 7
  max_per_ticker: 25            # articles kept per ticker per run (filings are always kept)
  sources: [sec, finnhub, yahoo]   # keyed providers are skipped without a key
  # alphavantage also works, but its news endpoint now needs a paid plan
  alphavantage_max_calls: 20    # free tier is 25 calls per day

sentiment:
  models: [finbert, llm]        # either is skipped if its package or API key is missing
  llm_model: claude-haiku-5-5     # cheapest; claude-opus-5-5 reads context better at ~40x the cost
  llm_batch_size: 25            # headlines per request
  half_life_hours: 48           # older stories count half as much every this many hours

catalysts:
  horizon_days: 30
  # Market-wide dates to show alongside your holdings' events. Not fetched automatically:
  # check federalreserve.gov (FOMC) and bls.gov (CPI, jobs) and keep this list current.
  macro_events:
    - {date: 2026-12-09, event: "FOMC rate decision"}

reports:
  movers: 5                     # rows in the daily "biggest movers" table
  news_hours: 36                # stored news this recent feeds the daily sentiment section
  catalyst_days: 7              # how far ahead the daily "coming up" section looks
  weekly:                       # overrides for `report weekly`
    movers: 10
    news_hours: 168             # the whole week
    catalyst_days: 14

alerts:                         # `report alerts`; "high" alerts are in positions >= high_weight
  big_move_pct: 0.05            # holding moved 5%+ since the previous close
  near_extreme: 0.02            # within 2% of its 52-week high or low
  loss_from_cost: -0.20         # position 20%+ below average cost
  earnings_days: 2
  expiry_days: 2                # held option expires within 2 days
  bearish_score: -0.40          # ticker news sentiment at or below this...
  min_articles: 3               # ...across at least this many articles
  filing_hours: 24              # 8-Ks filed in the last day
  high_weight: 0.05

alphavantage:                   # insider trades, macro and earnings calls (free key: 25 calls/day)
  max_calls: 20                 # per run, leaving a few for `earnings-call` by hand
  refresh_hours: 20             # skip anything fetched more recently than this
  call_lookback_days: 7         # look for transcripts of earnings reported this recently

insiders:                       # which Form 4 trades show up in reports and alerts
  min_buy: 25000                # open-market purchases at least this big ($)
  min_sale: 1000000             # sales at least this big (most sales are routine)

earnings_calls:
  model: claude-haiku-5-5       # summarizes each transcript in a few bullets

ideas:                          # `ideas`: add / hold / trim / sell for your holdings
  add_score: 2.0                # points needed for an add...
  trim_score: -2.0              # ...a trim
  sell_score: -3.0              # ...and a sell (-3 is every bearish signal at once)
  add_room: 0.8                 # no adds once a position is 80% of risk.max_position_weight
  analyst_upside: 0.20          # mean target this far above the price: +1
  analyst_downside: -0.05       # this far below: -1
  min_analysts: 3
  min_articles: 3               # news needs this many articles to count
  news_hours: 72                # how much stored news feeds the sentiment signal
  insider_days: 90              # open-market insider buys this recent count...
  insider_buy_min: 25000        # ...if at least this big ($)
  earnings_days: 7              # note earnings this close
  long_term_days: 45            # note gains lots turning long-term this soon

robinhood:
  session_days: 30              # how long a saved login is asked to last (Robinhood may cap it)
  login_timeout_min: 10         # wait this long for you to approve a login in the Robinhood app

run:                            # `run`: what the scheduled job does
  weekly_on: friday             # also write the weekly report on this day
  network_wait_min: 10          # after waking from sleep, wait this long for Wi-Fi

notify:                         # where `run` sends alerts; secrets go in .env
  channels: [desktop, ntfy]     # any of: desktop (Windows toast), ntfy (phone push), email
  min_level: watch              # "high" to only hear about alerts in big positions
  always: false                 # true sends a one-line "all clear" on quiet days too
  ntfy_server: https://ntfy.sh
  smtp_host: smtp.gmail.com
  smtp_port: 587
