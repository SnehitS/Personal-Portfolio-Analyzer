benchmarks: [SPY, QQQ]

database: data/processed/portfolio.db

risk:
  max_position_weight: 0.25     # flag any single position above 25% of equity
  max_sector_weight: 0.40       # flag any sector above 40% of holdings
  large_loss_pct: 0.20          # flag positions down more than 20% from cost
  earnings_window_days: 7       # flag earnings within this many days
  long_term_window_days: 30     # flag lots that turn long-term within this many days
  idle_cash_pct: 0.10           # flag when cash is above 10% of equity
  option_expiry_window_days: 7  # flag option positions expiring within this many days
  high_short_interest: 0.15     # flag short interest above 15% of float
  correlation_threshold: 0.80   # report holding pairs whose daily returns correlate above this

news:
  lookback_days: 7
  max_per_ticker: 25            # articles kept per ticker per run (filings are always kept)
  sources: [sec, alphavantage, finnhub, yahoo]   # keyed providers are skipped without a key
  alphavantage_max_calls: 20    # free tier is 25 calls per day

sentiment:
  models: [finbert, llm]        # either is skipped if its package or API key is missing
  llm_model: claude-opus-5-5
  llm_batch_size: 25            # headlines per request
  half_life_hours: 48           # older stories count half as much every this many hours

catalysts:
  horizon_days: 30
  # Market-wide dates to show alongside your holdings' events. Not fetched automatically:
  # check federalreserve.gov (FOMC) and bls.gov (CPI, jobs) and keep this list current.
  macro_events:
    - {date: 2026-12-09, event: "FOMC rate decision"}

reports:
  movers: 5                     # rows in the daily "biggest movers" table
  news_hours: 36                # stored news this recent feeds the daily sentiment section
  catalyst_days: 7              # how far ahead the daily "coming up" section looks
  weekly:                       # overrides for `report weekly`
    movers: 10
    news_hours: 168             # the whole week
    catalyst_days: 14

alerts:                         # `report alerts`; "high" alerts are in positions >= high_weight
  big_move_pct: 0.05            # holding moved 5%+ since the previous close
  near_extreme: 0.02            # within 2% of its 52-week high or low
  loss_from_cost: -0.20         # position 20%+ below average cost
  earnings_days: 2
  expiry_days: 2                # held option expires within 2 days
  bearish_score: -0.40          # ticker news sentiment at or below this...
  min_articles: 3               # ...across at least this many articles
  filing_hours: 24              # 8-Ks filed in the last day
  high_weight: 0.05
